<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro</title>

<style>
* {
    margin: 0px 0px 0px 0px;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial;
}

body {
    background: #0f172a;
    color: white;
    display: flex;
    justify-content: center;
    padding: 40px;
}

.container {
    width: 400px;
    background: #1e293b;
    padding: 20px;
    border-radius: 10px;
}

h2 {
    margin-bottom: 15px;
}

input, button {
    width: 100%;
    margin-bottom: 10px;
    padding: 10px;
    border: none;
    border-radius: 5px;
}

input {
    background: #334155;
    color: white;
}

button {
    background: #22c55e;
    color: white;
    cursor: pointer;
}

.lista {
    margin-top: 20px;
    list-style: none;
    text-align: center;
}

.item {
    background: #334155;
    padding: 10px;
    border-radius: 5px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
}
</style>
</head>

<body>

<div class="container">
    <h2>Cadastro de Veículo</h2>

    <input type="text" id="nome" class="inputs" placeholder="Nome">
    <input type="text" id="placa" class="inputs" placeholder="Placa">
    <input type="text" id="transportadora" class="inputs" placeholder="Transportadora">

    <button id="btn">Cadastrar</button>

    <ul class="lista" id="lista">
    </ul>
   
</div>

<script>
        let btn = document.getElementById("btn")

    btn.addEventListener("click", ()=>{
    let name = document.getElementById  ("nome") 
    let plate = document.getElementById("placa")
    let transporter = document.getElementById("transportadora")
    let list = document.getElementById("lista")

    if(name.value.trim() === "" || plate.value === 0 ||
      transporter.value.trim() === 0){
        let inputs = document.querySelectorAll(".inputs")
        inputs.forEach((valor)=>{
         if(valor.value.trim() === ""){
         valor.style.backgroundColor = "red"
         }else{
         valor.style.backgroundColor = "green"
          }
           })}else{
            let li = document.createElement("li")
            li.innerHTML = `Nome: ${name.value} </br> Placa: ${plate.value} </br> Transportador: ${transporter.value}`
            list.appendChild(li)
                     }
                      })
</script>
</body>
</html>
